<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi Rohith | Portfolio</title>
    <style>
        /* --- START OVERLAY (Fixes Autoplay Block) --- */
        #startOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #F5F3FF;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .start-btn {
            padding: 20px 40px;
            background: #8B5CF6;
            color: white;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }
        
        /* ... Keep all your previous CSS below ... */
    </style>
</head>
<body>

    <div id="startOverlay">
        <div class="start-btn">Enter Portfolio</div>
    </div>

    <audio id="bgMusicTrack" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const overlay = document.getElementById('startOverlay');
        const audio = document.getElementById('bgMusicTrack');

        overlay.addEventListener('click', () => {
            // Fade out overlay
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);
            
            // Force play audio immediately after user gesture
            audio.play().catch(e => console.error("Audio failed:", e));
        });

        // ... Your existing script logic ...
    </script>
</body>
</html>
